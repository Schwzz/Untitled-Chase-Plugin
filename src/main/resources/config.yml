# UntitledChaseGame Configuration

# Maximum players allowed in a round (0 = unlimited)
max-players: 0

# Minimum players required when the round actually starts
min-players: 2

# Server identifier number (set via /UCG set server <number>)
server-number: 0

# Phase durations (in seconds)
starting-duration: 60
playing-duration: 300
voting-duration: 30

# Fraction of participants assigned as Chasers; at least one Chaser is always assigned
chaser-ratio: 0.20

# Seconds remaining when Runners become visible
runner-reveal-seconds: 60

# Minimum YES votes required to restart, while still requiring a YES majority
restart-yes-threshold: 1

# Time a newly converted Chaser must wait before tagging
tag-cooldown-seconds: 1

# Time a PLAYING participant may reconnect before being removed
reconnect-grace-seconds: 30

# Locations (set via /UCG set <type>)
# Play areas are stored as: locations.play-area.<number>
# Runner spawns are stored as: locations.play-area.<number>.runner
# Chaser spawns are stored as: locations.play-area.<number>.chaser
locations:
  lobby: null
  waiting-area: null